<body><main><h1>Política y sociedad en Platón y Aristóteles</h1><div id="app"></div></main>
<script>
'use strict';
// La respuesta se identifica por su índice original, nunca por su posición barajada.
const bank = [
{q:'¿Por qué relacionan Platón y Aristóteles la política con la ética y la antropología?',o:['Porque consideran que la vida en comunidad permite satisfacer necesidades y alcanzar una vida buena.','Porque sostienen que las leyes de la naturaleza determinan de forma absoluta el poder político.','Porque afirman que el individuo es independiente de la comunidad y no necesita normas.','Porque reducen la justicia a un acuerdo puramente convencional entre individuos egoístas.'],a:0,e:'Platón y Aristóteles relacionan política, ética y antropología porque la comunidad permite satisfacer necesidades y crear las condiciones para una vida buena.'},
{q:'¿Cómo era la participación política en la democracia directa de Atenas?',o:['Todos los habitantes de la ciudad participaban sin excepciones en la asamblea.','Los ciudadanos varones adultos participaban en la asamblea y muchos cargos se adjudicaban por sorteo.','El poder se concentraba exclusivamente en un monarca hereditario asesorado por filósofos.','Los cargos públicos se reservaban exclusivamente a los sabios basándose en exámenes teóricos.'],a:1,e:'En Atenas la democracia era directa; participaban los varones adultos en la asamblea, mientras mujeres, esclavos y extranjeros quedaban excluidos.'},
{q:'¿Qué defendían los sofistas respecto al debate entre physis (naturaleza) y nomos (ley o costumbre)?',o:['Que todas las leyes procedían directamente de un mandato divino inalterable.','Que las normas eran idénticas y naturales en todas las polis griegas.','Que las leyes tenían con frecuencia un carácter convencional y dependían de acuerdos humanos.','Que la naturaleza humana impedía la creación de cualquier tipo de orden político.'],a:2,e:'Los sofistas destacaron el carácter convencional de las leyes al observar que estas cambiaban de una ciudad a otra.'},
{q:'¿Qué acontecimiento histórico contribuyó decisivamente a la desconfianza de Platón hacia los gobiernos existentes?',o:['La victoria de Atenas frente a Esparta en la guerra del Peloponeso.','La instauración pacífica de la democracia radical tras las reformas de Pericles.','La ejecución de Sócrates por la democracia restaurada y la violencia del gobierno de los Treinta Tiranos.','La expansión pacífica del imperio macedonio sobre el territorio de la Hélade.'],a:2,e:'La violencia de los Treinta Tiranos y la condena a muerte de Sócrates por la democracia reforzaron la desconfianza de Platón hacia los gobiernos de su época.'},
{q:'¿Qué problema político principal denuncia Platón mediante el símil del barco?',o:['La falta de recursos materiales para abastecer a los marineros en alta mar.','La separación entre poder y saber, donde se valora la ambición antes que la preparación del piloto.','La subordinación excesiva de los marineros a las decisiones racionales del capitán.','La ausencia total de leyes escritas que regulen el comercio marítimo.'],a:1,e:'El símil del barco muestra una comunidad que disputa por conquistar el poder sin poseer conocimientos, despreciando al verdadero sabio.'},
{q:'¿Qué función cumple la Idea de Bien en la propuesta política de Platón?',o:['Constituir el fundamento del conocimiento y la referencia para orientar justamente la acción del gobernante.','Asegurar la acumulación de riqueza y propiedad privada entre los guardianes de la ciudad.','Justificar el predominio de los deseos corporales en la parte apetitiva del alma.','Sustituir por completo la necesidad de la educación matemática y dialéctica.'],a:0,e:'La Idea de Bien es el fundamento del conocimiento y la referencia necesaria para que el gobernante juzgue qué beneficia a la ciudad.'},
{q:'¿Cómo se relaciona la estructura tripartita del alma con la organización de la ciudad en Platón?',o:['Cada clase social se corresponde con una parte del alma: racional (gobernantes), irascible (guardianes) y apetitiva (productores).','Todas las clases sociales poseen exclusivamente la parte apetitiva del alma humana.','Los gobernantes se guían por los apetitos corporales y los productores por la razón pura.','No existe ninguna correspondencia entre la psicología individual y la estructura política.'],a:0,e:'Platón establece una correspondencia exacta entre las tres partes del alma (racional, irascible, apetitiva) y los tres grupos de la ciudad.'},
{q:'¿En qué consiste la justicia según Platón, tanto en el individuo como en el Estado?',o:['En que cada parte o grupo cumpla adecuadamente su propia función bajo la dirección de la razón o el saber.','En la repartición absolutamente igualitaria de todas las tierras y bienes económicos.','En la alternancia continua en el poder de todos los ciudadanos por sorteo.','En la supresión de las leyes para permitir la libertad ilimitada de los ciudadanos.'],a:0,e:'La justicia es el orden en el que cada parte o grupo cumple su función sin invadir las tareas ajenas, bajo el mandato de la razón.'},
{q:'¿Qué medida adopta Platón respecto a la vida privada de los guardianes y gobernantes?',o:['Les obliga a acumular grandes riquezas privadas para garantizar su independencia.','Suprime la propiedad privada y la familia tradicional para evitar conflictos de intereses económicos.','Les permite fundar dinastías hereditarias basadas en el linaje familiar.','Les exige dedicarse en exclusiva al comercio y a la producción agrícola.'],a:1,e:'Platón restringe la propiedad privada y la familia entre los guardianes para separar el poder político del interés económico.'},
{q:'¿Qué representa la alegoría de la caverna en su aplicación política?',o:['La necesidad de que el prisionero liberado que ha conocido el Bien regrese para asumir responsabilidades de gobierno.','La imposibilidad absoluta de que el ser humano conozca la verdad mediante la razón.','La superioridad del conocimiento sensible frente a las realidades inteligibles.','La defensa de la democracia como el régimen político más perfecto.'],a:0,e:'Quien alcanza el conocimiento del Bien mediante la liberación de la caverna tiene la obligación moral de regresar y gobernar por turnos.'},
{q:'¿Cómo describe Platón la degradación de los regímenes políticos?',o:['Desde la monarquía justa hasta la democracia perfecta sin etapas intermedias.','Desde la aristocracia ideal hacia la timocracia, la oligarquía, la democracia y, finalmente, la tiranía.','Desde la tiranía inicial hasta la instauración de una república basada en la clase media.','Los regímenes políticos no sufren ningún proceso de cambio ni deterioro histórico.'],a:1,e:'Platón describe una secuencia de deterioro político que va de la aristocracia a la timocracia, oligarquía, democracia y tiranía.'},
{q:'¿Cómo define Aristóteles la naturaleza del ser humano en relación con la comunidad?',o:['Como un ser antisocial que solo sobrevive en absoluta aislamiento.','Como un animal político por naturaleza cuya convivencia plena se alcanza en la polis.','Como un ser creado exclusivamente para el intercambio comercial internacional.','Como un individuo guiado únicamente por instintos destructivos.'],a:1,e:'Aristóteles afirma expresamente que el ser humano es un animal político por naturaleza y que su convivencia más completa se da en la polis.'},
{q:'¿Qué papel desempeña el logos (razón y lenguaje) en la comunidad política según Aristóteles?',o:['Permite comunicar lo justo y lo injusto y deliberar sobre lo conveniente para la convivencia.','Obliga a los ciudadanos a obedecer órdenes sin comprender su significado.','Sustituye por completo la necesidad de leyes escritas e instituciones estables.','Impide cualquier forma de acuerdo pacífico entre ciudadanos diversos.'],a:0,e:'El logos permite a los humanos comunicar nociones morales como lo justo y lo injusto y deliberar conjuntamente.'},
{q:'¿Cuál es el criterio principal que utiliza Aristóteles para clasificar y juzgar las formas de gobierno?',o:['El número de gobernantes y si el poder se ejerce buscando el bien común o el beneficio particular.','La cantidad de recursos económicos que posee el territorio de la polis.','La duración temporal del mandato de los gobernantes en el cargo.','El grado de subordinación de la ciudad al poder macedonio.'],a:0,e:'Aristóteles distingue los regímenes según cuántos gobiernan y si buscan el bien común o su propio interés particular.'},
{q:'¿Qué regímenes considera Aristóteles como formas rectas o correctas de gobierno?',o:['Tiranía, oligarquía y democracia entendida como el gobierno de los pobres.','Monarquía, aristocracia y república (politeia).','Democracia radical, timocracia y tiranía militar.','Oligarquía, tiranía y aristocracia basada en la riqueza.'],a:1,e:'Las formas rectas orientadas al bien común son la monarquía (uno), la aristocracia (pocos) y la república o politeia (muchos).'},
{q:'¿Qué características tiene la politeia según la propuesta de Aristóteles?',o:['Un régimen que concentra todo el poder en manos de un único filósofo-rey.','Un régimen que combina elementos democráticos y oligárquicos para lograr el equilibrio social.','Un sistema basado en la supresión total de las leyes y de la propiedad privada.','Una tiranía moderada que beneficia exclusivamente a los ciudadanos más ricos.'],a:1,e:'La politeia combina elementos de la democracia y de la oligarquía para integrar a distintos grupos y evitar abusos.'},
{q:'¿Por qué considera Aristóteles que una clase media amplia favorece la estabilidad política?',o:['Porque los extremos de riqueza y pobreza alimentan conflictos, mientras la clase media acepta mejor el equilibrio.','Porque los ciudadanos de clase media poseen un saber absoluto equiparable al del filósofo-gobernante.','Porque la clase media queda exenta de cumplir las leyes de la comunidad.','Porque impide totalmente la existencia de leyes escritas.'],a:0,e:'Una clase media amplia evita los conflictos derivados de los extremos de riqueza y pobreza, favoreciendo la estabilidad.'},
{q:'¿Qué papel asigna Aristóteles a la ley en la organización política?',o:['Las leyes son innecesarias si los gobernantes actúan guiados por sus pasiones.','La ley proporciona criterios estables frente al favoritismo y debe orientarse siempre al bien común.','La ley debe garantizar exclusivamente el enriquecimiento de la clase gobernante.','La ley es un obstáculo artificial que destruye la virtud natural del individuo.'],a:1,e:'La primacía de la ley ofrece criterios estables frente a la arbitrariedad, siempre que se oriente al bien común.'},
{q:'¿En qué coinciden fundamentalmente las propuestas políticas de Platón y Aristóteles?',o:['En que la política debe crear las condiciones de la vida buena, orientándose al bien de la comunidad mediante la virtud y la educación.','En sufragio universal igualitario para todos los habitantes sin distinción de género.','En la abolición total de la propiedad privada y de la familia para todos los ciudadanos.','En la defensa de la democracia ateniense como el mejor sistema posible.'],a:0,e:'Ambos coinciden en vincular la política a la vida buena, la virtud y el bien común, apoyándose en la educación.'},
{q:'¿Cómo se diferencian principalmente las soluciones políticas de Platón y Aristóteles?',o:['Platón confía la dirección al conocimiento superior del Bien y la especialización; Aristóteles atiende más a la pluralidad, las leyes y el equilibrio institucional.','Platón defiende la democracia radical y Aristóteles la tiranía militar absoluta.','Platón rechaza la importancia de la educación y Aristóteles la considera irrelevante.','Platón fundamenta la política en la economía y Aristóteles en la Idea de Bien suprasensible.'],a:0,e:'Platón confía en el saber del filósofo-gobernante y la armonía jerárquica, mientras Aristóteles valora la diversidad, las leyes y el equilibrio social.'}
];
function shuffle(values){const result=values.slice();for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;}
function makeAttempt(){return shuffle(bank.map((item,id)=>({...item,id,options:shuffle(item.o.map((text,key)=>({text,key})))})));}
function grade(items,answers){return items.reduce((sum,item,i)=>sum+Number(answers[i]===item.a),0);}
const app=document.getElementById('app');let attempt=[],answers=[],position=0,locked=false;
function el(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;}
function focusHeading(heading){heading.tabIndex=-1;heading.focus();}
function start(){attempt=makeAttempt();answers=[];position=0;locked=false;showQuestion();}
function showQuestion(){app.replaceChildren();locked=false;const item=attempt[position];const count=el('p',`Pregunta ${position+1} de ${attempt.length}`,'meta');app.append(count);const progress=el('div',undefined,'progress');progress.setAttribute('role','progressbar');progress.setAttribute('aria-label','Preguntas respondidas');progress.setAttribute('aria-valuemin','0');progress.setAttribute('aria-valuemax',String(attempt.length));progress.setAttribute('aria-valuenow',String(position));const fill=el('span');fill.style.width=`${position/attempt.length*100}%`;progress.append(fill);app.append(progress);const heading=el('h2',item.q);app.append(heading);const choices=el('div',undefined,'options');item.options.forEach((option,i)=>{const button=el('button',undefined,'option');button.type='button';button.append(el('span','ABCD'[i],'letter'),el('span',option.text));button.addEventListener('click',()=>{if(locked)return;locked=true;answers.push(option.key);position++;if(position===attempt.length)showResults();else showQuestion();});choices.append(button);});app.append(choices);focusHeading(heading);}
function showResults(){app.replaceChildren();const correct=grade(attempt,answers);const heading=el('h2','Resultados del test');app.append(heading);const score=el('div',undefined,'score');score.append(el('p',`Aciertos: ${correct} de ${attempt.length}`),el('p',`Nota: ${(correct/attempt.length*10).toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1})} / 10`));app.append(score);const restart=el('button','Reiniciar test','primary');restart.type='button';restart.addEventListener('click',start);app.append(restart,el('h2','Revisión de todas las preguntas'));attempt.forEach((item,i)=>{const ok=answers[i]===item.a;const card=el('section',undefined,`review ${ok?'correct':'incorrect'}`);card.append(el('p',`${i+1}. ${ok?'Acierto':'Error'}`,'status'),el('h3',item.q));const chosen=item.options.findIndex(option=>option.key===answers[i]);const right=item.options.findIndex(option=>option.key===item.a);card.append(el('p',`Tu respuesta: ${'ABCD'[chosen]}. ${item.o[answers[i]]}`),el('p',`Respuesta correcta: ${'ABCD'[right]}. ${item.o[item.a]}`),el('p',`Explicación: ${item.e}`));app.append(card);});focusHeading(heading);window.scrollTo(0,0);}
start();
</script></body></html>
