<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Del mito al logos · Autoevaluación</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1e293b;background:#f3f4f6;line-height:1.6}*{box-sizing:border-box}body{margin:0;padding:32px 16px}main{max-width:820px;margin:auto;background:white;padding:clamp(22px,5vw,48px);border-radius:20px;box-shadow:0 8px 30px #1e293b0a}h1,h2{color:#3730a3;line-height:1.3}h1{font-size:clamp(25px,4vw,34px);margin:0 0 10px}h2{font-size:23px}p{margin:12px 0}.meta{color:#475569;font-size:15px}.progress{height:8px;background:#e0e7ff;border-radius:8px;margin:16px 0 28px;overflow:hidden}.progress span{display:block;background:#4f46e5;height:100%;transition:width .2s}.options{display:grid;gap:12px;margin:24px 0}button{font:inherit;cursor:pointer;border-radius:12px;padding:16px 20px;min-height:56px}button:focus-visible{outline:3px solid #4338ca;outline-offset:4px}.option{display:flex;gap:16px;text-align:left;align-items:center;background:#fff;border:1px solid #c7d2fe;color:#1e293b;width:100%}.option:hover{background:#eef2ff;border-color:#6366f1}.letter{background:#e0e7ff;color:#3730a3;font-weight:700;border-radius:7px;min-width:32px;text-align:center;padding:2px}.primary{background:#4338ca;color:#fff;border:0}.primary:hover{background:#3730a3}.hint{font-size:14px;color:#64748b}.score{padding:22px;background:#eef2ff;border-radius:12px;margin:22px 0;font-size:20px}.review{border:1px solid #e2e8f0;border-left:5px solid;padding:20px;border-radius:12px;margin:18px 0}.review.correct{border-left-color:#15803d}.review.incorrect{border-left-color:#b91c1c}.status{font-weight:700}.correct .status{color:#166534}.incorrect .status{color:#991b1b}.review h3{font-size:18px;line-height:1.5;margin:8px 0}.review p{font-size:15px}details{margin:20px 0;font-size:14px;color:#475569}summary{cursor:pointer}footer{margin-top:30px;font-size:13px;color:#64748b}@media(max-width:480px){body{padding:12px}main{border-radius:14px}.option{padding:14px;gap:12px}}
</style>

<body><main><h1>1. Cosmovisión mítica y explicación filosófica</h1><div id="app"></div></main>
<script>
'use strict';
// La respuesta se identifica por su índice original, nunca por su posición barajada.
const bank = [
{q:'¿Cómo entendía la comunidad griega los mitos que transmitía?',o:['Como relatos verdaderos que organizaban su visión del mundo.','Como ficciones recreativas separadas de sus creencias comunes.','Como hipótesis provisionales sometidas a discusión pública.','Como descripciones naturales apoyadas en principios impersonales.'],a:0,e:'Los mitos se consideraban verdaderos y estructuraban la visión compartida por la comunidad.'},
{q:'¿Qué función desempeñaban los aedos durante la Época Oscura?',o:['Recitaban poemas épicos que transmitían valores y creencias.','Redactaban leyes públicas que regulaban la convivencia ciudadana.','Comparaban textos escritos para examinar sus contradicciones.','Argumentaban sobre principios naturales en debates ciudadanos.'],a:0,e:'Los aedos eran poetas profesionales que recitaban poemas en banquetes y celebraciones aristocráticas, conservando la tradición oral.'},
{q:'Un relato se acepta porque es antiguo y la comunidad lo ha repetido durante generaciones. ¿En qué se basa su autoridad?',o:['En su capacidad de justificar relaciones causales.','En su pertenencia a una tradición compartida.','En su resistencia al examen de objeciones.','En su concordancia con principios impersonales.'],a:1,e:'La autovalidación del mito se apoya en la antigüedad, la repetición y el reconocimiento comunitario, sin exigir argumentos externos.'},
{q:'¿Qué significa que los dioses homéricos sean antropomórficos?',o:['Que poseen forma humana y experimentan pasiones humanas.','Que poseen naturaleza abstracta y permanecen fuera del mundo.','Que encarnan leyes naturales y actúan sin intenciones personales.','Que representan instituciones políticas y deliberan como ciudadanos.'],a:0,e:'Los dioses homéricos tienen forma y pasiones humanas, aunque son inmortales y más poderosos que los mortales.'},
{q:'¿Qué personaje representa mejor el ideal de areté de los poemas homéricos?',o:['Un artesano estimado por su habilidad y su riqueza comercial.','Un legislador valorado por sus normas y sus argumentos públicos.','Un aristócrata admirado por su valor guerrero y su noble linaje.','Un pensador reconocido por su crítica y sus principios racionales.'],a:2,e:'La areté homérica se vincula al valor guerrero, el honor, el prestigio y la pertenencia a un linaje aristocrático.'},
{q:'¿Qué designa el Kháos al comienzo de la Teogonía?',o:['La desorganización de las primeras instituciones humanas.','La confrontación entre distintas voluntades de los dioses.','La abertura o el abismo del que surgen otras realidades.','La regularidad de los procesos que ordenan la naturaleza.'],a:2,e:'El material precisa que Kháos significa abertura o abismo, y no desorden.'},
{q:'¿Qué esquema utiliza la Teogonía para explicar el origen del orden del mundo?',o:['La deliberación y el acuerdo entre comunidades ciudadanas.','La generación y el parentesco entre realidades divinizadas.','La comparación y la revisión de argumentos incompatibles.','La relación y la dependencia entre principios impersonales.'],a:1,e:'Hesíodo proyecta procesos semejantes al nacimiento y al parentesco sobre el origen de las realidades divinizadas.'},
{q:'Una comunidad conserva dos relatos incompatibles sobre el origen del mundo. ¿Qué actitud encaja con la cosmovisión mítica descrita?',o:['Revisarlos para construir una explicación causal común.','Abandonarlos por carecer de una justificación racional.','Compararlos para decidir cuál evita las contradicciones.','Aceptarlos como parte de la tradición de la comunidad.'],a:3,e:'La cosmovisión mítica admite la convivencia de relatos contradictorios sin exigir que se resuelva su incompatibilidad.'},
{q:'¿Qué aportaba el mito a la vida colectiva de las comunidades griegas?',o:['Un método de crítica para revisar sus explicaciones.','Un conjunto de razones ajenas a la tradición local.','Un sentido compartido que orientaba normas y conductas.','Un sistema de causas que describía procesos impersonales.'],a:2,e:'El mito ofrecía orientación, normas compartidas, sentido y cohesión social.'},
{q:'¿Por qué la recuperación de la escritura favoreció la reflexión crítica?',o:['Permitió fijar los relatos, releerlos y compararlos entre sí.','Permitió reforzar los linajes, sus privilegios y sus genealogías.','Permitió vincular los relatos a recitaciones y celebraciones orales.','Permitió asociar la verdad al prestigio de poetas y narradores.'],a:0,e:'La escritura facilitó la comparación de textos, la detección de contradicciones y la formulación de nuevas preguntas.'},
{q:'¿Qué efecto tuvo el contacto comercial con pueblos de otras culturas?',o:['Reforzó el valor universal de las creencias de cada ciudad.','Debilitó la certeza de que los mitos propios fueran universales.','Fundamentó la autoridad de los relatos en el linaje de los viajeros.','Convirtió las diferencias religiosas en un orden común de leyes.'],a:1,e:'Conocer otras creencias mostró que los mitos griegos no eran compartidos por todos los pueblos y debilitó su carácter indiscutible.'},
{q:'¿Por qué los nuevos comerciantes y artesanos cuestionaron la autoridad del ideal heroico?',o:['Porque su riqueza procedía del reconocimiento de linajes nobles.','Porque sus oficios se organizaban mediante relatos de los aedos.','Porque su prestigio dependía de hazañas en guerras aristocráticas.','Porque sus intereses tenían escaso reflejo en los relatos épicos.'],a:3,e:'Estos grupos acumulaban riqueza sin pertenecer a linajes nobles y no encontraban sus formas de vida representadas en el ideal aristocrático.'},
{q:'¿Qué caracteriza a la polis como forma de organización?',o:['Una red de navegantes vinculados por rutas y acuerdos comerciales.','Una comunidad de ciudadanos con leyes e instituciones compartidas.','Una agrupación de aedos dedicada a transmitir los poemas heroicos.','Una asociación de linajes unidos por genealogías y honores guerreros.'],a:1,e:'La polis era una ciudad-estado y, además de un espacio físico, una comunidad con leyes, instituciones y responsabilidades.'},
{q:'¿Qué cambio en la idea de justicia favorecía la labor del legislador?',o:['La vinculación de las normas al prestigio de los héroes guerreros.','La dependencia del orden respecto a las disputas entre divinidades.','La concepción de la convivencia como un orden escrito y accesible.','La identificación de las decisiones con la autoridad de cada linaje.'],a:2,e:'Las leyes escritas favorecieron una justicia entendida como orden común, accesible y comprensible para los ciudadanos.'},
{q:'Un ciudadano defiende una propuesta en la asamblea. ¿Qué actuación refleja la práctica política que favoreció el logos?',o:['Justificar su propuesta mediante razones que otros puedan examinar.','Respaldar su propuesta mediante el prestigio de su ascendencia noble.','Vincular su propuesta a una intervención favorable de una divinidad.','Acreditar su propuesta por la antigüedad de una narración comunitaria.'],a:0,e:'El debate público exigía convencer, dar razones y justificar decisiones, preparando el desarrollo del discurso racional.'},
{q:'Ante una tormenta, ¿qué tipo de investigación corresponde al nuevo enfoque filosófico?',o:['Identificar la disputa divina que expresa el fenómeno.','Reconstruir la genealogía sagrada que origina el fenómeno.','Recuperar la narración heredada que describe el fenómeno.','Buscar el funcionamiento natural que explica el fenómeno.'],a:3,e:'El nuevo enfoque considera que la naturaleza puede tener un funcionamiento propio y busca causas racionales en lugar de intenciones divinas.'},
{q:'Si dos afirmaciones de una explicación filosófica se contradicen, ¿qué exige la coherencia?',o:['Conservarlas por el reconocimiento que tengan en la comunidad.','Revisarlas para corregir o rechazar lo que resulte incompatible.','Ordenarlas por la antigüedad de las tradiciones que las transmiten.','Valorarlas por la autoridad de quienes defiendan cada afirmación.'],a:1,e:'La explicación racional exige examinar las contradicciones y revisar, corregir o rechazar las afirmaciones que se oponen.'},
{q:'¿Qué implica la vocación universal de una explicación filosófica?',o:['Que su validez dependa del reconocimiento de una comunidad local.','Que su aceptación proceda del respeto por una autoridad religiosa.','Que sus razones puedan valer para personas de distintos orígenes.','Que su transmisión conserve los valores de un linaje aristocrático.'],a:2,e:'La filosofía aspira a ofrecer razones comprensibles y válidas para cualquier persona que razone, con independencia de su origen o creencias.'},
{q:'¿Qué relación con la vida práctica muestra el doble interés filosófico por la naturaleza y el ser humano?',o:['Comprender el mundo y aportar criterios razonados para convivir.','Interpretar el cosmos y conservar modelos heredados sin discusión.','Describir el cambio y fundamentar el prestigio de los linajes nobles.','Examinar la existencia y atribuir la justicia a decisiones divinas.'],a:0,e:'La filosofía busca comprender la realidad y orientar racionalmente la vida humana, la justicia y la convivencia política.'},
{q:'Una cultura desarrolla argumentos filosóficos y mantiene relatos míticos con fines educativos. ¿Cómo se interpreta esta situación?',o:['Como una vuelta a la autoridad aristocrática que precedió a la polis.','Como una renuncia a justificar las explicaciones mediante razones.','Como una sustitución del debate público por la tradición de los aedos.','Como una convivencia compatible con la transformación de los métodos.'],a:3,e:'El paso del mito al logos fue gradual: cambió la forma de justificar el conocimiento, mientras el mito conservó funciones simbólicas, educativas y culturales.'}
];
function shuffle(values){const result=values.slice();for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;}
function makeAttempt(){return shuffle(bank.map((item,id)=>({...item,id,options:shuffle(item.o.map((text,key)=>({text,key})))})));}
function grade(items,answers){return items.reduce((sum,item,i)=>sum+Number(answers[i]===item.a),0);}
const app=document.getElementById('app');let attempt=[],answers=[],position=0,locked=false;
function el(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;}
function focusHeading(heading){heading.tabIndex=-1;heading.focus();}
function start(){attempt=makeAttempt();answers=[];position=0;locked=false;showQuestion();}
function showQuestion(){app.replaceChildren();locked=false;const item=attempt[position];const count=el('p',`Pregunta ${position+1} de ${attempt.length}`,'meta');app.append(count);const progress=el('div',undefined,'progress');progress.setAttribute('role','progressbar');progress.setAttribute('aria-label','Preguntas respondidas');progress.setAttribute('aria-valuemin','0');progress.setAttribute('aria-valuemax',String(attempt.length));progress.setAttribute('aria-valuenow',String(position));const fill=el('span');fill.style.width=`${position/attempt.length*100}%`;progress.append(fill);app.append(progress);const heading=el('h2',item.q);app.append(heading);const choices=el('div',undefined,'options');item.options.forEach((option,i)=>{const button=el('button',undefined,'option');button.type='button';button.append(el('span','ABCD'[i],'letter'),el('span',option.text));button.addEventListener('click',()=>{if(locked)return;locked=true;answers.push(option.key);position++;if(position===attempt.length)showResults();else showQuestion();});choices.append(button);});app.append(choices);focusHeading(heading);}
function showResults(){app.replaceChildren();const correct=grade(attempt,answers);const heading=el('h2','Resultados del test');app.append(heading);const score=el('div',undefined,'score');score.append(el('p',`Aciertos: ${correct} de ${attempt.length}`),el('p',`Nota: ${(correct/attempt.length*10).toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1})} / 10`));app.append(score);const restart=el('button','Reiniciar test','primary');restart.type='button';restart.addEventListener('click',start);app.append(restart,el('h2','Revisión de todas las preguntas'));attempt.forEach((item,i)=>{const ok=answers[i]===item.a;const card=el('section',undefined,`review ${ok?'correct':'incorrect'}`);card.append(el('p',`${i+1}. ${ok?'Acierto':'Error'}`,'status'),el('h3',item.q));const chosen=item.options.findIndex(option=>option.key===answers[i]);const right=item.options.findIndex(option=>option.key===item.a);card.append(el('p',`Tu respuesta: ${'ABCD'[chosen]}. ${item.o[answers[i]]}`),el('p',`Respuesta correcta: ${'ABCD'[right]}. ${item.o[item.a]}`),el('p',`Explicación: ${item.e}`));app.append(card);});focusHeading(heading);window.scrollTo(0,0);}
start();
</script></body></html>
